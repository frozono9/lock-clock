<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>Update Clock</title><style>:root{color-scheme:dark;font-family:system-ui;background:#08090c;color:#f1f2f6}main{max-width:380px;margin:15vh auto;padding:24px}h1{font-weight:500;letter-spacing:-1px}p{color:#9aa5ba;line-height:1.6}button{font:inherit;border:0;border-radius:12px;background:#d6e2ff;color:#141b2b;padding:16px 22px;cursor:pointer}button:disabled{opacity:.5}a{color:#d6e2ff}</style></head>
<body><main><h1>Update Clock.</h1><p>Open this between performances. Your saved background, font and settings will be kept.</p><button id="update">Install latest version</button><p id="status" role="status"></p><p><a href="./">Back to Clock</a></p></main>
<script>
function waitFor(worker, target) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => finish(new Error('The update is taking longer than expected. Please retry online.')), 20000);
    function finish(error) { clearTimeout(timer); worker.removeEventListener('statechange', check); error ? reject(error) : resolve(); }
    function check() { if (worker.state === target) finish(); else if (worker.state === 'redundant') finish(new Error('Update failed. Please retry online.')); }
    worker.addEventListener('statechange', check); check();
  });
}
document.getElementById('update').addEventListener('click', async event => {
  const button = event.target, status = document.getElementById('status');
  button.disabled = true; status.textContent = 'Checking for the latest version…';
  try {
    const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    await registration.update();
    if (registration.installing) { status.textContent = 'Saving the latest version for offline use…'; await waitFor(registration.installing, 'installed'); }
    if (registration.waiting) {
      const worker = registration.waiting;
      status.textContent = 'Opening the updated app…';
      const activated = waitFor(worker, 'activated');
      worker.postMessage({ type: 'ACTIVATE_UPDATE' });
      await activated;
    }
    location.replace('./');
  } catch (error) { status.textContent = error.message || 'Could not update. Please retry online.'; button.disabled = false; }
});
</script></body></html>
